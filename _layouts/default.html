<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 155 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;1,8..60,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
</head>
<body>

  <header class="site-header">
    <div class="site-header-inner">
      <a href="{{ site.baseurl }}/" class="site-logo">{{ site.title }}</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav">
        <a href="{{ site.baseurl }}/" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ site.baseurl }}/entries/" {% if page.url contains '/entries' %}class="active"{% endif %}>Entries</a>
        <a href="{{ site.baseurl }}/topics/" {% if page.url contains '/topics' %}class="active"{% endif %}>Topics</a>
        <a href="{{ site.baseurl }}/about/" {% if page.url contains '/about' %}class="active"{% endif %}>About</a>
      </nav>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span class="footer-copy">&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</span>
      <div class="footer-links">
        <a href="{{ site.baseurl }}/about/">About</a>
        {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}" target="_blank">GitHub</a>{% endif %}
      </div>
    </div>
  </footer>

  <script>
    const toggle = document.getElementById('navToggle');
    const nav = document.getElementById('siteNav');
    toggle.addEventListener('click', () => nav.classList.toggle('open'));
  </script>

</body>
</html>
