title: Thinking in Genomes
tagline: "Each entry starts with a biological question — then works through the reasoning, the analysis, and the interpretation."
description: "A question-driven blog about genomics, evolution, and metagenomics."
url: "https://thinkingenome.github.io"
baseurl: "/ThinkInGenome"

# Author
author:
  name: "Thinking in Genomes"

# Social (optional — remove lines you don't need)
github_username: ThinkInGenome
# twitter_username: your_handle

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Permalinks — keeps existing post URLs intact
permalink: /posts/:title/

# Pagination
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

paginate: 20
paginate_path: "/page/:num/"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github
  - node_modules
  - vendor

# Collections
collections_dir: .

# Defaults — so existing posts don't need layout: post in every file
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
