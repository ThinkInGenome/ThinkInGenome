title: Thinking in Genomes
tagline: "Each entry starts with a biological question — then works through the reasoning, the analysis, and the interpretation."
description: "A question-driven blog about genomics, evolution, and metagenomics."
url: "https://thinkingenome.github.io"
baseurl: "/ThinkInGenome"

author:
  name: "Thinking in Genomes"

github_username: ThinkInGenome

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /posts/:title/

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

paginate: 20
paginate_path: "/page/:num/"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github
  - node_modules
  - vendor
  - tools

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
